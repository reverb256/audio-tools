# Lightworld Relay — 12 original tracks, deep house -> trance, 61:19 continuous mix.
# Paths are relative to --root (default /music). Generation jobs go to zephyr's
# 3090 through the gpu-music-job wrapper (acestep backend).
#
# Style prompts are the ones written for this mix. Cue fields follow the plan's
# cue table: 32-bar phrase blends with tempo ramps, except track 11, which is a
# deliberate hard cut into the breakdown (mix_in_bars: 0, transition: cut).
title: Lightworld Relay
slug: lightworld-relay
output: mixes/lightworld-relay
sample_rate: 48000
phrase_bars: 16
takes: 3
backend: acestep
acestep:
  wrapper: gpu-music-job
  poll_interval: 30
  # timeout: 7200        # seconds; omitted = poll until the take appears
  token_env: MIXGEN_ACESTEP_TOKEN

tracks:
  - title: Heliostat Dawn
    slug: heliostat-dawn
    style: "deep house, 120 BPM, A minor. warm sub-bass, dusty Rhodes chords, soft shaker, tape hiss, spacious mix, 16-bar drums-only intro, 32-bar drums-only outro, no fade-out, instrumental"
    bpm: 120
    key: 8A
    duration: "5:20"
    instrumental: true
    takes: 3
    job: {kind: gpu, host: sentry}
    play_bars: 160
    mix_in_bars: 0
    transition: long_blend
    ramp: false

  - title: Tidal Optics
    slug: tidal-optics
    style: "deep house, 121 BPM, A minor. rubbery sub-bass, filtered chord stabs, rim clicks, vinyl texture, hypnotic 16-bar drums-only intro, 32-bar drums-only outro, no fade-out, instrumental"
    bpm: 121
    key: 8A
    duration: "5:17"
    instrumental: true
    takes: 3
    job: {kind: gpu, host: sentry}
    play_bars: 160
    mix_in_bars: 32
    transition: eq_bass_swap
    ramp: true

  - title: Glasshouse Orbit
