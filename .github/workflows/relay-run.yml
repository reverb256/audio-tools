name: relay-run tests
on:
  pull_request:
    paths:
      - "relayrun/**"
      - "tests/test_relay_run.py"
      - "pyproject.toml"
      - "examples/relay-cue.example.yaml"
      - "README.md"
      - ".github/workflows/relay-run.yml"
  push:
    branches: [main]
    paths:
      - "relayrun/**"
      - "tests/test_relay_run.py"
      - "pyproject.toml"
      - "examples/relay-cue.example.yaml"
      - "README.md"
      - ".github/workflows/relay-run.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg rsync
      - name: Install package and test runner
        run: pip install -e ".[dev]"
      - name: relay-run tests
        run: python -m pytest -q tests/test_relay_run.py
      - name: Console script
        run: relay-run --help && relay-run validate --help && relay-run split-sideb --help
