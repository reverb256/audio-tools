name: djmix tests
on:
  pull_request:
    paths: ["djmix/**", "tests/**", ".github/workflows/djmix-tests.yml"]
  push:
    branches: [main]
    paths: ["djmix/**", "tests/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System tools
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg rubberband-cli libsndfile1
      - name: Python deps (same pins as the music-tools image)
        run: pip install numpy==2.1.3 soundfile==0.12.1 librosa==0.10.2.post1 pyloudnorm==0.1.1 scipy pyyaml pytest
      - name: Tests (librosa and rubberband engines)
        run: python -m pytest -q tests
      - name: Dry-run smoke
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "tests")
          from pathlib import Path
          from test_djmix import click_track
          d = Path("/tmp/djsmoke"); d.mkdir(exist_ok=True)
          click_track(d / "a.wav", 122, 48, 1000.0, 0.2)
          click_track(d / "b.wav", 126, 48, 4000.0, 0.3)
          (d / "cue.yaml").write_text("output: mix.wav\ntracks:\n  - {file: a.wav, target_bpm: 124}\n  - {file: b.wav, target_bpm: 124, mix_in_bars: 16, transition: eq_bass_swap}\n")
          PY
          python -m djmix /tmp/djsmoke/cue.yaml --root /tmp/djsmoke --dry-run
