[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-tools-mixgen"
version = "0.1.0"
description = "Plan-driven track generation, QA, mastering, DJ-mix assembly, and album release"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "soundfile==0.12.1",
    "scipy==1.14.1",
    "librosa==0.10.2.post1",
    "pyyaml==6.0.2",
    "pyloudnorm==0.1.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
mixgen = "mixgen.cli:main"
relay-run = "relayrun.cli:main"

[tool.setuptools]
packages = ["mixgen", "mixgen.backends", "djmix", "relayrun"]
